name: Update AltStore Source

on:
  schedule:
    - cron: "*/15 * * * *"  # every 15 minutes
  push:
    paths:
      - config.json
      - scripts/generate_source.py
      - .github/workflows/update-source.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-altstore-source
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate source.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/generate_source.py

      - name: Commit and push if changed
        run: |
          if [ -n "$(git status --porcelain source.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

            git add source.json
            git commit -m "chore: update source.json"

            git pull --rebase origin main
            git push origin HEAD:main
          else
            echo "No changes."
          fi
